on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

name: test-coverage

permissions: read-all

jobs:
  test-coverage:
    uses: CTTIR/.github/.github/workflows/test-coverage.yaml@main
    with:
      # Local tests-only coverage exceeds 91%; allow headroom for optional
      # native readers while guarding against substantial coverage loss.
      floor: 85
    secrets: inherit
